name: Build NovaClient

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "HATA: build.gradle dosyası bulunamadı!"
            echo "Depoya ZIP içindeki proje dosyalarını yüklediğinden emin ol."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle projesi bulundu: $DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build JAR
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
